<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Fresh Medical) -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Target Glow -->
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Container -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bgGrad3)" />
  
  <!-- Outer Detection Target -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="20 15" stroke-opacity="0.5" />

  <!-- Inner Detection Circle -->
  <g filter="url(#glow3)">
    <circle cx="256" cy="256" r="130" fill="#ffffff" stroke="#06b6d4" stroke-width="14" />
  </g>
  
  <!-- Medical Cross / AllerX 'X' -->
  <g transform="translate(166, 166)">
    <!-- Main Cross (Vertical Bar) -->
    <rect x="65" y="0" width="50" height="180" rx="25" fill="#06b6d4" />
    
    <!-- AllerX 'X' (Horizontal Bar - Split) -->
    <!-- Safe Side -->
    <path d="M0 90 C0 76, 11 65, 25 65 H82 V115 H25 C11 115, 0 104, 0 90 Z" fill="#06b6d4" />
    <!-- Alert Side (The 'X') -->
    <path d="M98 65 H155 C169 65, 180 76, 180 90 V90 C180 104, 169 115, 155 115 H98 V65 Z" fill="#ef4444" />
  </g>
</svg>