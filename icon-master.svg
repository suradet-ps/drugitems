<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (near-white canvas per DESIGN) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>
  </defs>

  <!-- App Container -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Detection Target (ink, faint) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#0a0a0a" stroke-width="8" stroke-dasharray="22 16" stroke-opacity="0.16" />

  <!-- Inner Detection Ring (ink) -->
  <circle cx="256" cy="256" r="148" fill="#ffffff" stroke="#0a0a0a" stroke-width="16" />

  <!-- Medical Cross / Detection 'X' - enlarged -->
  <g transform="translate(150, 150)">
    <!-- Vertical Bar (coral) -->
    <rect x="71" y="0" width="70" height="212" rx="35" fill="#ff4d3d" />

    <!-- Horizontal Bar, Left Arm (coral) -->
    <path d="M0 106 C0 88, 14 74, 32 74 H96 V138 H32 C14 138, 0 124, 0 106 Z" fill="#ff4d3d" />

    <!-- Horizontal Bar, Right Arm (alert red - semantic) -->
    <path d="M116 74 H180 C198 74, 212 88, 212 106 V106 C212 124, 198 138, 180 138 H116 V74 Z" fill="#d45656" />
  </g>
</svg>