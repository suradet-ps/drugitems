# cargo-deny configuration for DrugItems
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
  # Marvin Attack timing sidechannel on rsa (transitive dep of sqlx-mysql
  # for caching_sha2_password auth). DrugItems connects over TLS on the
  # local hospital LAN - advisory itself says local use on a non-compromised
  # computer is fine. No patched release exists.
  { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql RSA auth exchange; TLS-only connections, local hospital LAN" },
  # proc-macro-error unmaintained (transitive dep of glib/gtk)
  "RUSTSEC-2024-0370",
  # proc-macro-error2 unmaintained (transitive dep of glib/gtk)
  "RUSTSEC-2026-0173",
  # paste unmaintained (transitive dep of glib/gtk, via pest/cfg-if chain)
  "RUSTSEC-2024-0436",
  # zbus_names / zvariant / zvariant_derive unmaintained as standalone crates;
  # merged into zbus 6. zbus 5.x is still pulled in by secret-service via
  # keyring on Linux only (Windows uses windows-native-keyring-store).
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x via keyring/secret-service on Linux; not used on Windows" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.x via keyring/secret-service on Linux; not used on Windows" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x via keyring/secret-service on Linux; not used on Windows" },
  # zip extraction advisories (SUID/SGID, symlink escape). calamine only reads
  # workbook entries via ZipArchive and never calls extract(), so these paths
  # are unreachable. calamine 0.36.1 (latest) pins zip ^8.6 - no zip 9 upgrade
  # until a calamine release supports it.
  { id = "RUSTSEC-2026-0367", reason = "zip extract() unused; calamine only reads xlsx entries and pins zip 8.x" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract() unused; calamine only reads xlsx entries and pins zip 8.x" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract() unused; calamine only reads xlsx entries and pins zip 8.x" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
  "Unicode-TOU",
  "CC0-1.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MPL-2.0",
]
confidence-threshold = 0.92

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []